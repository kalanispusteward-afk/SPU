<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Step Scale - Sunrise Professionals Unit</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --electric: #00D2FF; --coral: #FF6B6B; --slate: #1E293B; --white: #F8FAFC;
    --surface: #FFFFFF; --border: rgba(0, 210, 255, 0.2); --disclaimer-bg: #FEF2F2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #F1F5F9; color: var(--slate); font-family: 'Barlow', sans-serif; line-height: 1.6; }
  
  .global-disclaimer { 
    background: var(--disclaimer-bg); color: #991B1B; padding: 12px; font-weight: 800; 
    text-align: center; border-bottom: 4px solid var(--coral); position: sticky; top: 0; z-index: 1000; text-transform: uppercase; font-size: 13px;
  }

  nav { background: var(--slate); color: white; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .nav-logo { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; color: var(--electric); text-decoration: none; text-transform: uppercase; }
  
  .page-wrap { max-width: 1000px; margin: 0 auto; padding: 3rem 1.5rem; }
  .tool-card { background: var(--surface); border: 1px solid var(--border); padding: 2rem; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
  
  label { display: block; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; color: var(--slate); text-transform: uppercase; margin-bottom: 5px; }
  select, input { width: 100%; padding: 12px; border: 2px solid #E2E8F0; border-radius: 4px; font-family: 'Barlow'; }
  
  button { background: var(--electric); color: var(--slate); border: none; padding: 14px 28px; font-weight: 900; text-transform: uppercase; cursor: pointer; border-radius: 4px; font-family: 'Barlow Condensed'; width: 100%; font-size: 18px; }
  
  .result { display: none; margin-top: 2rem; padding: 2rem; background: var(--slate); color: white; border-radius: 8px; text-align: center;}
  .result.show { display: block; }
  .big-rate { font-size: 56px; font-weight: 900; color: var(--electric); display: block; }
  
  .rate-table-wrap { overflow-x: auto; background: white; padding: 1.5rem; margin-top: 2.5rem; border: 1px solid var(--border); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
  th { background: #F8FAFC; padding: 12px; text-align: right; border-bottom: 2px solid #E2E8F0; font-family: 'Barlow Condensed'; text-transform: uppercase; }
  td { padding: 10px; border-bottom: 1px solid #F1F5F9; text-align: right; }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: white; font-weight: 700; }
</style>
</head>
<body>
<div class="global-disclaimer">THIS SITE IS INDEPENDENTLY MAINTAINED BY A UNION MEMBER. IT IS NOT AFFILIATED WITH OR ENDORSED BY SEIU LOCAL 1107 OR SUNRISE HOSPITAL.</div>

<nav>
  <a href="index.html" class="nav-logo">SPU HUB</a>
  <a href="index.html" style="color:white; text-decoration:none; font-size:12px; font-weight:700;">BACK TO HOME</a>
</nav>

<div class="page-wrap">
  <h1 style="font-family:'Barlow Condensed'; font-size: 48px; text-transform: uppercase; margin-bottom: 1rem;">Wage Scale Calculator</h1>
  
  <div class="tool-card">
    <div class="form-grid">
      <div>
        <label>Profession</label>
        <select id="profession">
          <option value="S1">Social Worker BSW (S1)</option>
          <option value="S2">Social Worker MSW (S2)</option>
          <option value="S3">Medical Technologist (S3)</option>
          <option value="S4">Sr Medical Technologist (S4)</option>
          <option value="S5">PT / OT / SLP (S5)</option>
          <option value="S6">Pharmacist (S6)</option>
        </select>
      </div>
      <div>
        <label>Status</label>
        <select id="status">
          <option value="FTPT">Full-time / Part-time</option>
          <option value="PRN">PRN / VSP</option>
        </select>
      </div>
      <div>
        <label>Scale Year</label>
        <select id="scaleYear">
          <option value="year1">Year 1 (Oct 2025)</option>
          <option value="year2">Year 2 (July 2026)</option>
          <option value="year3">Year 3 (July 2027)</option>
        </select>
      </div>
      <div>
        <label>Credited YOE</label>
        <input id="yoe" type="number" step="0.1" placeholder="e.g. 7.5">
      </div>
    </div>
    <button onclick="calculateStep()">Calculate Hourly Rate</button>
  </div>

  <div class="result" id="resultBox">
    <div id="outStep" style="font-family:'Barlow Condensed'; font-size:14px; text-transform:uppercase; color:var(--coral); font-weight:700;"></div>
    <span class="big-rate" id="outRate"></span>
    <p id="outNote" style="opacity:0.8; font-size:14px; margin-top:10px;"></p>
  </div>

  <div class="rate-table-wrap">
    <h3 style="font-family:'Barlow Condensed'; margin-bottom:1rem; text-transform: uppercase; color: var(--slate);">Full Wage Scale Reference</h3>
    <table id="rateTable"></table>
  </div>
</div>
