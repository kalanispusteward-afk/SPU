<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --electric: #00D2FF; --coral: #FF6B6B; --slate: #1E293B; --disclaimer-bg: #FEF2F2; }
  body { background: #F1F5F9; color: var(--slate); font-family: 'Barlow', sans-serif; margin: 0; }
  .global-disclaimer { background: var(--disclaimer-bg); color: #991B1B; padding: 12px; font-weight: 800; text-align: center; border-bottom: 4px solid var(--coral); position: sticky; top: 0; z-index: 1000; text-transform: uppercase; font-size: 12px; }
  .tool-card { max-width: 900px; margin: 3rem auto; background: white; padding: 2.5rem; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
  select, input { width: 100%; padding: 12px; border: 1px solid #E2E8F0; border-radius: 4px; font-family: 'Barlow'; }
  .btn-calc { background: var(--electric); color: var(--slate); border: none; padding: 14px; font-weight: 900; text-transform: uppercase; cursor: pointer; border-radius: 4px; width: 100%; font-family: 'Barlow Condensed'; font-size: 18px; }
  .result { display: none; margin-top: 2rem; padding: 2rem; background: var(--slate); color: white; border-radius: 4px; text-align: center; }
  .result.show { display: block; }
  table { width: 100%; border-collapse: collapse; margin-top: 2rem; font-size: 12px; }
  th, td { border: 1px solid #E2E8F0; padding: 8px; text-align: right; }
  th { background: #F8FAFC; text-align: left; }
</style>
</head>
<body>
<div class="global-disclaimer">THIS SITE IS INDEPENDENTLY MAINTAINED BY A UNION MEMBER. IT IS NOT AFFILIATED WITH OR ENDORSED BY SEIU LOCAL 1107 OR SUNRISE HOSPITAL.</div>

<div class="tool-card">
  <h1 style="font-family:'Barlow Condensed'; font-size: 42px; text-transform: uppercase; margin-bottom: 1.5rem;">Wage Calculator</h1>
  <div class="form-grid">
    <div><label>Profession</label><select id="profession"><option value="S1">S1 - Social Worker BSW</option><option value="S2">S2 - Social Worker MSW</option><option value="S3">S3 - Medical Technologist</option><option value="S4">S4 - Sr Medical Technologist</option><option value="S5">S5 - PT / OT / SLP</option><option value="S6">S6 - Pharmacist</option></select></div>
    <div><label>Status</label><select id="status"><option value="FTPT">Full-time / Part-time</option><option value="PRN">PRN / VSP</option></select></div>
    <div><label>Scale Year</label><select id="scaleYear"><option value="year1">Year 1 (Oct 2025)</option><option value="year2">Year 2 (July 2026)</option><option value="year3">Year 3 (July 2027)</option></select></div>
    <div><label>Credited YOE</label><input id="yoe" type="number" step="0.1" placeholder="e.g. 7.5"></div>
  </div>
  <button class="btn-calc" onclick="calculateStep()">Calculate Rate</button>
  <div class="result" id="resultBox">
    <div id="outStep" style="color:var(--coral); font-weight:700; text-transform:uppercase;"></div>
    <div id="outRate" style="font-size: 48px; font-weight: 900; color: var(--electric);"></div>
    <div id="outNote" style="font-size: 13px; opacity: 0.8; margin-top: 10px;"></div>
  </div>
  <table id="rateTable" style="margin-top:2rem;"></table>
</div>

function calculateStep() {
  const grade = document.getElementById('profession').value;
  const status = document.getElementById('status').value;
  const year = document.getElementById('scaleYear').value;
  const yoe = parseFloat(document.getElementById('yoe').value || 0);
  const gIdx = ['S1','S2','S3','S4','S5','S6'].indexOf(grade);
  let matchedStep = steps[0];
  if(status === 'PRN') {
    matchedStep = 10; if(grade === 'S2') matchedStep = 13; if(grade === 'S5') matchedStep = 35;
  } else {
    for (const s of steps) { if (yoe >= s) matchedStep = s; }
  }
  const rate = wageData[year][matchedStep][gIdx];
  document.getElementById('outRate').innerText = `$${rate.toFixed(2)}`;
  document.getElementById('outStep').innerText = `Matched Step: ${matchedStep}`;
  document.getElementById('resultBox').classList.add('show');
}
</script>
</body>
</html>
