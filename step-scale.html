<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Wage Calculator - SPU Independent</title>
<style>
  :root { --electric: #00D2FF; --slate: #1E293B; --happy-bg: #F8FAFC; --coral: #FF6B6B; }
  body { font-family: 'Barlow', sans-serif; background: var(--happy-bg); margin: 0; }
  .global-disclaimer { background: #FEF2F2; color: #991B1B; padding: 14px; font-weight: 800; text-align: center; border-bottom: 4px solid var(--coral); text-transform: uppercase; }
  .calc-wrap { max-width: 800px; margin: 3rem auto; background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
  select, input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #E2E8F0; border-radius: 6px; }
  .btn-calc { background: var(--electric); color: var(--slate); border: none; padding: 15px; width: 100%; font-weight: 900; text-transform: uppercase; cursor: pointer; border-radius: 6px; }
  .result-display { margin-top: 2rem; text-align: center; display: none; }
  .rate { font-size: 64px; font-weight: 900; color: var(--electric); }
</style>
</head>
<body>
<div class="global-disclaimer">INDEPENDENT MEMBER SITE: NOT AFFILIATED WITH SEIU 1107 OR SUNRISE HOSPITAL.</div>

<div class="calc-wrap">
  <h1 style="font-family:'Barlow Condensed'; text-transform: uppercase; font-size: 42px;">Wage Calculator</h1>
  <label>Profession</label>
  <select id="profession">
    <option value="S1">Social Worker BSW (S1)</option>
    <option value="S2">Social Worker MSW (S2)</option>
    <option value="S3">Medical Technologist (S3)</option>
    <option value="S4">Sr Medical Technologist (S4)</option>
    <option value="S5">PT / OT / SLP (S5)</option>
    <option value="S6">Clinical Pharmacist (S6)</option>
  </select>
  <label>Scale Year</label>
  <select id="scaleYear">
    <option value="year1">Year 1 (Current)</option>
    <option value="year2">Year 2 (July 2026)</option>
    <option value="year3">Year 3 (July 2027)</option>
  </select>
  <label>Status</label>
  <select id="empStatus">
    <option value="FTPT">Full-Time / Part-Time</option>
    <option value="PRN">PRN / VSP</option>
  </select>
  <button class="btn-calc" onclick="calculate()">Calculate Rate</button>

  <div id="result" class="result-display">
    <div class="rate" id="rateVal">$0.00</div>
    <p id="note" style="font-weight: 600;"></p>
  </div>
</div>

<script>
const wageData = {
  year1: { // Appendix A Year 1 [cite: 1209-1215, 1416-1421, 1474-1479, 1649-1654]
    10: [42.28, 45.48, 45.93, 48.44, 58.51, 83.86],
    13: [43.54, 46.89, 47.37, 49.89, 60.28, 86.36],
    35: [49.09, 52.78, 53.28, 56.15, 67.90, 97.29]
  },
  year2: { // Appendix A Year 2 [cite: 1216-1221, 1422-1427, 1480-1485, 1655-1660]
    10: [43.12, 46.39, 46.85, 49.41, 59.68, 85.54],
    13: [44.41, 47.83, 48.32, 50.89, 61.49, 88.08],
    35: [50.08, 53.84, 54.35, 57.27, 69.26, 99.24]
  },
  year3: { // Appendix A Year 3 [cite: 1222-1227, 1428-1433, 1486-1489, 1661-1666]
    10: [43.77, 47.09, 47.56, 50.15, 60.58, 86.82],
    13: [45.08, 48.55, 49.04, 51.65, 62.41, 89.40],
    35: [50.83, 54.64, 55.16, 58.13, 70.30, 100.73]
  }
};

function calculate() {
  const grade = document.getElementById('profession').value;
  const year = document.getElementById('scaleYear').value;
  const status = document.getElementById('empStatus').value;
  const gIdx = ['S1','S2','S3','S4','S5','S6'].indexOf(grade);
  
  let step = 10; // Default for most FTPT and PRN
  if(grade === 'S2') step = 13;
  if(grade === 'S5') step = 35;

  const rate = wageData[year][step][gIdx];
  document.getElementById('rateVal').innerText = `$${rate.toFixed(2)}`;
  document.getElementById('result').style.display = 'block';
  document.getElementById('note').innerText = `Rate based on Step ${step} (Contractual minimum)`;
}
</script>
</body>
</html>
